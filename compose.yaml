# Local stack: the same pieces as production (deploy/helm/noonside).
# `mise run db:up` starts it, `mise run db:reset` re-creates the database. The
# keys below are local-only dev values; never use them anywhere else.
#
#   Postgres  127.0.0.1:54322  postgres/postgres, database postgres
#   Auth      127.0.0.1:9999   GoTrue; the SPA reaches it as /auth/v1 through Vite
#   Mailpit   http://127.0.0.1:54324 (SMTP 54325): emails of the API and GoTrue
#   SFTPGo    API http://127.0.0.1:8090 (admin/noonside-dev-sftpgo), SFTP 2022, FTP 2121
#   Swagger   http://localhost:8081 (`docker compose --profile docs up -d`)
#
# Ports can be moved with NOONSIDE_{PG,AUTH,MAIL,SMTP}_PORT and
# NOONSIDE_SFTPGO_{API,SFTP,FTP}_PORT (not the passive FTP range), e.g. to run a
# second copy next to this one.
name: noonside

x-dev-keys:
  # `noonside keygen gotrue`; AUTH_SERVICE_ROLE_KEY (vars.dev_secret_key in
  # mise.toml) is signed with it.
  jwt-keys: &jwt-keys '[{"alg":"ES256","crv":"P-256","d":"xYuPxzSpjnMwGshQcwGHHTSo-OTd9YIVcMH-beQElOc","ext":true,"key_ops":["sign","verify"],"kid":"8ccfa7e2-712f-4c86-b54c-0d734010bcdf","kty":"EC","use":"sig","x":"08QiX2eGHrYwivSCNerc1lGjnSSUTyYqsrPCX0N01tE","y":"ixjH9OojMaQ4qqkDG6NP9bnkGX5K3Axq4F8u4ao8qsM"}]'
  jwt-secret: &jwt-secret zwXYsZdHuKvQIZuunWnfHRguA5R6gkjIsk0t7HB1ZeTMwVxtMBDW5EXehNsigwAT

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${NOONSIDE_PG_PORT:-54322}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/helm/noonside/files/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    configs:
      - source: dev-passwords
        target: /docker-entrypoint-initdb.d/20-dev-passwords.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  auth:
    # Keep in sync with auth.image in deploy/helm/noonside/values.yaml.
    image: supabase/gotrue:v2.196.0
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${NOONSIDE_AUTH_PORT:-9999}:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # Public URLs: the SPA (Vite) proxies /auth/v1 to this container.
      API_EXTERNAL_URL: http://localhost:5173/auth/v1
      GOTRUE_JWT_ISSUER: http://localhost:5173/auth/v1
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5173/reset-password,http://127.0.0.1:5173/reset-password
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@postgres:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_KEYS: *jwt-keys
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_VALID_METHODS: HS256,RS256,ES256
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_EXP: "3600"
      # Links in the emails; GoTrue drops API_EXTERNAL_URL's path otherwise.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://localhost:5173/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: http://localhost:5173/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://localhost:5173/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: http://localhost:5173/auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your email
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your password
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your sign-in link
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new email
      # Served by the API (auth_templates_dir) when `mise run dev` runs;
      # otherwise GoTrue falls back to its built-in templates.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://host.docker.internal:8080/auth-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://host.docker.internal:8080/auth-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://host.docker.internal:8080/auth-templates/magic_link.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://host.docker.internal:8080/auth-templates/email_change.html
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@noonside.local
      GOTRUE_SMTP_SENDER_NAME: noonside
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      # Effectively unlimited locally (email_sent counts per hour).
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "360000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_RATE_LIMIT_VERIFY: "30"
      GOTRUE_RATE_LIMIT_OTP: "30"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "127.0.0.1:${NOONSIDE_MAIL_PORT:-54324}:8025"
      - "127.0.0.1:${NOONSIDE_SMTP_PORT:-54325}:1025"

  sftpgo:
    # Hosted FTP (solarlog_hosted): devices upload over FTP, the API manages
    # the users over the REST API and reads the files over SFTP. Its event
    # rule calls the API's upload hook on the host (`mise run dev`).
    image: drakkan/sftpgo:v2.6.6-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${NOONSIDE_SFTPGO_API_PORT:-8090}:8080"
      - "127.0.0.1:${NOONSIDE_SFTPGO_SFTP_PORT:-2022}:2022"
      - "127.0.0.1:${NOONSIDE_SFTPGO_FTP_PORT:-2121}:2121"
      # Passive FTP data connections (same numbers inside and outside).
      - "127.0.0.1:50000-50009:50000-50009"
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      # mise.toml vars.dev_sftpgo_password
      SFTPGO_DEFAULT_ADMIN_PASSWORD: noonside-dev-sftpgo
      SFTPGO_FTPD__BINDINGS__0__PORT: "2121"
      SFTPGO_FTPD__BINDINGS__0__FORCE_PASSIVE_IP: 127.0.0.1
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__START: "50000"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__END: "50009"
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      SFTPGO_WEBDAVD__BINDINGS__0__PORT: "0"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "false"
    volumes:
      # Users' homes (hosted_ftp_home_base) and the SQLite database with the
      # SSH host keys.
      - sftpgo-data:/srv/sftpgo
      - sftpgo-home:/var/lib/sftpgo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.4
    profiles: [docs]
    ports:
      - "8081:8080"
    environment:
      URL: http://localhost:8080/openapi.yaml

configs:
  dev-passwords:
    content: |
      ALTER ROLE supabase_auth_admin PASSWORD 'postgres';

volumes:
  pgdata:
  sftpgo-data:
  sftpgo-home:
